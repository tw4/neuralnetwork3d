[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nn3d"
version = "0.1.1"
description = "Watch neural networks train in live 3D in your browser - for Keras/TensorFlow"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Visualization",
]
authors = [{ name = "Mert Türkoğlu" }]
keywords = ["neural-network", "visualization", "keras", "tensorflow", "3d", "webgl"]

# Bilerek sifir zorunlu bagimlilik: sunucu tamamen stdlib.
# numpy zaten keras/tensorflow ile birlikte gelir, ayrica istemiyoruz.
dependencies = []

[project.optional-dependencies]
keras = ["keras>=3.0", "numpy>=1.22"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/tw4/neuralnetwork3d"
Website = "https://mertturkoglu.com"

[tool.hatch.build.targets.wheel]
packages = ["src/nn3d"]
